# Lỗi AI hay gặp ở Dockerfile (hadolint đã chạy ở build.yml, đây là các quy ước riêng của repo).
rules:
  - id: ai-dockerfile-from-not-pinned
    languages: [generic]
    severity: ERROR
    message: "FROM phải pin digest (image:tag@sha256:...). Quy ước repo, tránh build không lặp lại được."
    pattern-regex: '(?m)^FROM\s+(?!scratch\b)(?!\S+@sha256:)(?!\$)(?!\S+\s+AS\s+\S+\s*$)\S+'
    paths:
      include: ["**/Dockerfile*", "**/*.dockertest"]

  - id: ai-dockerfile-curl-pipe-shell
    languages: [generic]
    severity: ERROR
    message: curl|sh chạy mã tải về không kiểm tra. Tải file, kiểm checksum, rồi chạy.
    pattern-regex: '(curl|wget)\b[^\n]*\|\s*(sudo\s+)?(sh|bash)\b'
    paths:
      include: ["**/Dockerfile*", "**/*.dockertest"]

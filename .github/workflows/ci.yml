name: ci-cd
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore', '.gitattributes']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore', '.gitattributes']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    uses: Quy-Organisation/ci-templates/.github/workflows/build.yml@v1.14
    with:
      image-name: frontend
      test-image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
      test-command: npm ci && npm run lint && npm run test:coverage
      test-opts: -v npm-cache:/root/.npm
      health-path: /
      smoke-match: '<div id="root"'

  scan-source:
    uses: Quy-Organisation/ci-templates/.github/workflows/scan-source.yml@v1.14
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    with:
      sonar-required: false  # chưa xác nhận SONAR_TOKEN/SONAR_HOST_URL ở org; đặt secret rồi bỏ dòng này
      sast-configs: --config p/javascript --config p/react
      sast-extra: --exclude node_modules --exclude dist
      fs-scanners: vuln,secret,misconfig,license
      fs-extra: --ignorefile .trivyignore.yaml --skip-dirs node_modules,dist
      sonar-extra: -Dsonar.exclusions=**/node_modules/**,**/dist/** -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  scan-image:
    needs: build
    uses: Quy-Organisation/ci-templates/.github/workflows/scan-image.yml@v1.14
    with:
      image-name: frontend
      health-path: /

  deploy:
    needs: [build, scan-source, scan-image]
    uses: Quy-Organisation/ci-templates/.github/workflows/deploy.yml@v1.14
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    with:
      image-name: frontend
      host-port: "8082"
      health-path: /

name: os-docker
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore', '.gitattributes']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  os:
    uses: Quy-Organisation/ci-templates/.github/workflows/os-docker.yml@v1.24
    with:
      native-command: npm ci && npm run lint && npm run build
      node-version: '22'
